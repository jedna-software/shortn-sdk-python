[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shortn-sdk"
dynamic = ["version"]
description = "Python SDK for the Shortn API: links, analytics, workspaces, reports and conversions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Jedna Software" }
]
keywords = ["shortn", "shortn-link", "url-shortener", "link-management", "analytics", "conversions", "attribution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://shortn.link"
Repository = "https://github.com/jedna-software/shortn-sdk-python"
Issues = "https://github.com/jedna-software/shortn-sdk-python/issues"

[tool.hatch.version]
path = "src/shortn_sdk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shortn_sdk"]

[tool.mypy]
python_version = "3.10"
strict = true
# Responses are decoded JSON, typed as TypedDicts at the method boundary.
disable_error_code = ["no-any-return"]
